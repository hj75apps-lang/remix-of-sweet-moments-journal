name: Android Instrumentation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/components/phone/**"
      - "src/services/phone.ts"
      - ".github/workflows/android-instrumentation.yml"

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator platforms;android-36 build-tools;36.0.0"
      - run: bun install --frozen-lockfile
      - run: bun run build:android
      - name: Run Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          script: cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest --no-daemon
