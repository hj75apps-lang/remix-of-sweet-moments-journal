name: Validate Launcher

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependencies:
    name: Audit dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check high and critical dependency advisories
        run: bun audit --audit-level=high
      - name: Generate a patch-only remediation proposal
        if: failure()
        run: bun audit fix --ignore-scripts
      - name: Preserve the remediation proposal for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-proposal
          path: |
            package.json
            bun.lock
          retention-days: 3
          if-no-files-found: error

  web:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Build web preview
        run: bun run build
