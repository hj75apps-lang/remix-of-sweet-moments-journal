name: Validate Launcher

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependencies:
    name: Audit dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check high and critical dependency advisories
        run: bun audit --audit-level=high
      - name: Generate a patch-only remediation proposal
        if: failure()
        run: bun audit fix --ignore-scripts
      - name: Preserve the remediation proposal for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-proposal
          path: |
            package.json
            bun.lock
          retention-days: 3
          if-no-files-found: error

  web:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Verify quota worker in workerd with persisted SQLite
        env:
          SAL_QUOTA_RUNTIME_DIR: ${{ runner.temp }}/sal-quota-runtime
          SAL_QUOTA_WORKER_BUNDLE: ${{ runner.temp }}/sal-quota-worker.mjs
          SAL_QUOTA_STORAGE_DIR: ${{ runner.temp }}/sal-quota-storage
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$SAL_QUOTA_RUNTIME_DIR" miniflare@4.20260706.0
          bun build infrastructure/navigation-quota/worker.ts --target=browser --outfile="$SAL_QUOTA_WORKER_BUNDLE"
          node scripts/test-navigation-quota-runtime.mjs
      - name: Build web preview
        run: bun run build
      - name: Verify compiled Cloudflare backend and private binding
        env:
          SAL_QUOTA_RUNTIME_DIR: ${{ runner.temp }}/sal-quota-runtime
          SAL_QUOTA_WORKER_BUNDLE: ${{ runner.temp }}/sal-quota-worker.mjs
          SAL_QUOTA_STORAGE_DIR: ${{ runner.temp }}/sal-quota-storage
        run: node scripts/test-navigation-backend-build.mjs
